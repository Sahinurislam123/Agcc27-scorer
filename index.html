<style>
:root{--bg:#07100d;--panel:#0d1b15;--panel2:#101f18;--line:#1f4934;--green:#00d47b;--gold:#ffc629;--gold2:#e8a90c;--text:#f5f7f5;--muted:#9ca9a1;--danger:#ff5555;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#10281b 0,#07100d 48%,#030705 100%);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:#10251a;color:var(--text);font-weight:700}button:hover{filter:brightness(1.12)}button.primary{background:linear-gradient(135deg,var(--gold),#ff9f16);border:0;color:#141008}button.green{background:#08794e;border-color:#13c982}button.danger{background:#351515;border-color:#773030;color:#ffaaaa}button.ghost{background:transparent}.wrap{max-width:1120px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ffdc50,#087c4b 58%,#151c4b);border:2px solid var(--gold);font-size:22px;font-weight:1000;color:white;text-shadow:0 2px 4px #000}.brand h1{font-size:19px;margin:0;letter-spacing:.4px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.small{font-size:12px;color:var(--muted)}.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid #5c4b16;color:var(--gold);border-radius:100px;padding:5px 10px;font-size:12px}.hero{padding:28px 24px;border:1px solid #345b3b;border-radius:24px;background:linear-gradient(115deg,rgba(4,45,27,.96),rgba(9,20,14,.96)),radial-gradient(circle at right,#155c34,transparent);position:relative;overflow:hidden}.hero:after{content:"🏏";position:absolute;font-size:120px;right:24px;bottom:-14px;opacity:.12;transform:rotate(-18deg)}.hero h2{font-size:clamp(27px,5vw,44px);line-height:1.1;margin:10px 0}.hero p{max-width:580px;color:#c1d0c6}.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 12px}.section-title h2{font-size:18px;margin:0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:linear-gradient(145deg,rgba(17,35,25,.98),rgba(8,17,12,.98));border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0;box-shadow:0 8px 26px #0002}.stat{font-size:28px;font-weight:900;color:var(--gold);margin:8px 0 0}.card h3{margin:0 0 10px;font-size:16px}.card p{color:var(--muted);margin:4px 0}.navgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.navtile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;min-height:105px;background:linear-gradient(150deg,#10251a,#08110c);border-color:#185538}.navtile .emoji{font-size:24px;color:var(--gold)}.navtile span:last-child{font-size:12px;color:var(--muted);font-weight:500}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input,.toolbar select{width:auto;min-width:150px}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:12px;color:#b9c9be}.field input,.field select,.field textarea,input,select,textarea{width:100%;min-width:0;border:1px solid #31533f;background:#06100b;color:var(--text);border-radius:10px;padding:12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:620px;background:#08130d}th,td{text-align:left;padding:12px;border-bottom:1px solid #193c29;white-space:nowrap}th{color:var(--green);font-size:12px;text-transform:uppercase;letter-spacing:.5px;background:#0d2116}td{font-size:14px}tr:last-child td{border-bottom:0}.row-actions{display:flex;gap:6px}.row-actions button{padding:6px 9px;font-size:12px}.empty{padding:25px;text-align:center;color:var(--muted)}.matchscore{display:flex;align-items:center;justify-content:space-between;gap:14px}.teamline{display:flex;align-items:center;gap:9px;font-weight:800}.teamcrest{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#132d1d;border:1px solid #3b704b;color:var(--gold);font-size:12px;font-weight:900}.score{font-size:25px;font-weight:900;white-space:nowrap}.gold{color:var(--gold)}.status{font-size:11px;border:1px solid #285c3c;color:#73ffb4;border-radius:50px;padding:4px 8px}.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:8px;margin:12px 0}.tabs button{white-space:nowrap}.tabs button.active{background:var(--gold);color:#171106;border-color:var(--gold)}.ballgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.ballgrid button{padding:17px 4px;font-size:17px}.ballgrid button.extra{color:var(--gold)}.bottomnote{margin:28px 0 8px;color:#708078;font-size:12px;text-align:center}.loginbox{max-width:440px;margin:8vh auto}.loginbox .card{padding:26px}.loginbox h2{text-align:center;font-size:28px}.loginbox .logo{width:76px;height:76px;font-size:30px;margin:0 auto}.loginbox .field{margin:14px 0}.loginbox button.full{width:100%;margin-top:10px}.notice{background:#1c291e;border:1px solid #3a522a;border-radius:10px;padding:10px;color:#b9c9be;font-size:12px}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#e9bd28;color:#111;padding:11px 16px;border-radius:10px;font-weight:800;box-shadow:0 6px 30px #0008;z-index:20}.pillrow{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:6px 10px;border:1px solid #2c6140;border-radius:30px;color:#b8c8bd;font-size:12px}.livebig{text-align:center;padding:16px}.livebig .runs{font-size:56px;font-weight:1000;color:var(--green);line-height:1.1}.muted{color:var(--muted)}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.right{text-align:right}.footer-actions{display:flex;gap:8px;flex-wrap:wrap}.dangertext{color:#ff7777}
@media(max-width:720px){.wrap{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.navgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{padding:22px 18px}.hero:after{font-size:80px;right:8px}.formgrid,.split{grid-template-columns:1fr}.top{align-items:flex-start}.brand h1{font-size:16px}.top .tag{max-width:120px}.score{font-size:20px}.card{padding:13px}.navtile{min-height:94px;padding:12px}.ballgrid{gap:5px}.ballgrid button{padding:14px 2px}.section-title{margin-top:22px}}
@media(max-width:390px){.navgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr 1fr}.teamcrest{width:30px;height:30px}.score{font-size:17px}}

<body><div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
const KEY='agcc-scorer-demo-v1';
const initial=()=>({
  admin:{email:'admin@agcc.local',password:'AGCC2026'},
  club:{name:"AGCC's Club",location:'Arati',year:'2026',ballType:'Tennis Ball',clubId:'agc253',ground:'ARATI'},
  tournament:{name:'ARATI GRAM CRICKET CARNIVAL',shortName:'AGCC',year:'2026',organizer:"AGCC's Club, Arati",start:'2026-06-13',end:'2026-06-14',format:'5 Overs',ballType:'Tennis Ball',venue:'Arati Ground',location:'Arati, Paschim Bardhaman, West Bengal',logo:'',banner:''},
  teams:[
    {id:'acr',name:'ARATI CHALLENGERS',short:'ACR',color:'#e6a42a'},
    {id:'akr',name:'ARATI KNIGHT RIDERS',short:'AKR',color:'#a87cff'},
    {id:'ar',name:'ARATI ROYALS',short:'AR',color:'#f14e9b'},
    {id:'asr',name:'ARATI SUNRISERS',short:'ASR',color:'#ff7c27'},
    {id:'ask',name:'ARATI SUPER KINGS',short:'ASK',color:'#f5cf2f'},
    {id:'aw',name:'ARATI WARRIORS',short:'AW',color:'#30aaff'}
  ],
  players:[
    {id:'p1',name:'Sk Azahar Uddin',team:'ar',role:'Batsman',runs:147,wickets:0},
    {id:'p2',name:'Md Sahanawaj Hossain',team:'ar',role:'Bowler',runs:12,wickets:12},
    {id:'p3',name:'Sk Shahbaz',team:'ar',role:'Batsman',runs:91,wickets:0},
    {id:'p4',name:'Sk Ali Zinna',team:'acr',role:'All-rounder',runs:88,wickets:3},
    {id:'p5',name:'Sk Tajamul',team:'aw',role:'Bowler',runs:20,wickets:9},
    {id:'p6',name:'Sk Rumjan Molla',team:'aw',role:'Bowler',runs:18,wickets:8}
  ],
  matches:[
    {id:'m1',title:'Final, Club Cricket',date:'2026-06-14',time:'15:15',venue:'Arati Eid Gah',teamA:'aw',teamB:'ar',overs:5,status:'Completed',scoreA:{r:30,w:7,b:30},scoreB:{r:71,w:0,b:30},winner:'ar',result:'ARATI ROYALS won by 41 runs',tournament:'ARATI GRAM CRICKET CARNIVAL'},
    {id:'m2',title:'Qualifier, Club Cricket',date:'2026-06-14',time:'13:00',venue:'Arati Ground',teamA:'ar',teamB:'acr',overs:5,status:'Completed',scoreA:{r:69,w:4,b:27},scoreB:{r:64,w:3,b:30},winner:'ar',result:'ARATI ROYALS won by 6 wickets',tournament:'ARATI GRAM CRICKET CARNIVAL'}
  ],
  activeMatch:null, lastScoring:null, history:[]
});
let db=load(), loggedIn=false, page='home', matchTab='summary', selectedTeam='all', editingId=null, tossWinner='', tossDecision='Bat', liveTab='scoring', battingTeam='', bowlingTeam='', striker='', nonStriker='', currentBowler='', innings=1, toastTimer;
function load(){try{return {...initial(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return initial()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function team(id){return db.teams.find(t=>t.id===id)||{name:'Unknown Team',short:'??',color:'#888'}}
function player(id){return db.players.find(p=>p.id===id)||{name:'Not selected'}}
function teamOptions(selected=''){return '<option value="">Select team</option>'+db.teams.map(t=>`<option value="${t.id}" ${t.id===selected?'selected':''}>${esc(t.name)}</option>`).join('')}
function playerOptions(selected='',teamId=''){return '<option value="">Select player</option>'+db.players.filter(p=>!teamId||p.team===teamId).map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)} — ${esc(team(p.team).short)}</option>`).join('')}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2500)}
function go(p){page=p;editingId=null;render();window.scrollTo(0,0)}
function header(){return `<header class="top"><div class="brand"><div class="logo">AG</div><div><h1>AGCC SCORER</h1><p>ARATI GRAM CRICKET CARNIVAL</p></div></div><div class="toolbar">${loggedIn?'<span class="tag">● ADMIN MODE</span><button class="ghost" onclick="logout()">Logout</button>':'<button class="ghost" onclick="go(\'login\')">Admin Login ↗</button>'}</div></header>`}
function shell(content){document.getElementById('app').innerHTML=`<div class="wrap">${header()}${content}<div class="bottomnote">AGCC Scorer • Demo mode • Data saved in this browser only</div></div>`}
function render(){if(page==='login'){renderLogin();return} if(page==='dashboard'&&!loggedIn){go('login');return} if(page==='admin'&&!loggedIn){go('login');return}
switch(page){case'home':renderHome();break;case'login':renderLogin();break;case'dashboard':renderDashboard();break;case'teams':renderTeams();break;case'players':renderPlayers();break;case'matches':renderMatches();break;case'matchform':renderMatchForm();break;case'toss':renderToss();break;case'live':renderLive();break;case'scorecard':renderScorecard();break;case'summary':renderSummary();break;case'tournament':renderTournament();break;case'points':renderPoints();break;case'settings':renderSettings();break;default:renderHome()}}
function renderHome(){const completed=db.matches.filter(m=>m.status==='Completed');const upcoming=db.matches.filter(m=>m.status!=='Completed');shell(`<section class="hero"><span class="tag">🏆 ${esc(db.tournament.year)} SEASON</span><h2>${esc(db.tournament.name)}</h2><p>Live scores, tournament details, teams, player statistics and match reports — all in one place.</p><div class="hero-actions"><button class="primary" onclick="go('matches')">View Matches →</button><button onclick="go('tournament')">Tournament Details</button><button onclick="go('dashboard')">Admin Panel ↗</button></div></section>
<div class="section-title"><h2>Tournament Overview</h2><span class="small">${esc(db.tournament.start)} — ${esc(db.tournament.end)}</span></div><div class="grid"><div class="card"><p>Teams</p><div class="stat">${db.teams.length}</div></div><div class="card"><p>Matches</p><div class="stat">${db.matches.length}</div></div><div class="card"><p>Completed</p><div class="stat">${completed.length}</div></div><div class="card"><p>Upcoming / Live</p><div class="stat">${upcoming.length}</div></div></div>
<div class="section-title"><h2>Recent Matches</h2><button onclick="go('matches')">All matches →</button></div>${db.matches.length?db.matches.slice().reverse().slice(0,4).map(matchCard).join(''):'<div class="card empty">No matches yet. Admin can create the first fixture.</div>'}
<div class="section-title"><h2>Club Shortcuts</h2></div><div class="navgrid"><button class="navtile" onclick="go('teams')"><span class="emoji">🛡️</span>Teams<span>All tournament teams</span></button><button class="navtile" onclick="go('players')"><span class="emoji">🏏</span>Players<span>Player profiles & stats</span></button><button class="navtile" onclick="go('points')"><span class="emoji">📊</span>Points Table<span>Standings</span></button><button class="navtile" onclick="go('tournament')"><span class="emoji">🏆</span>Tournament<span>Overview & winners</span></button></div>`)}
function renderLogin(){document.getElementById('app').innerHTML=`<div class="wrap">${header()}<div class="loginbox"><div class="card"><div class="logo">AG</div><h2><span class="gold">Admin</span> Login</h2><p class="muted" style="text-align:center">Access tournament management</p><form onsubmit="login(event)"><div class="field"><label>Email / Username</label><input id="loginEmail" autocomplete="username" placeholder="admin@agcc.local" required></div><div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter password" required></div><button class="primary full" type="submit">Login →</button></form><p class="notice" style="margin-top:16px">Demo credentials: <b>admin@agcc.local</b> / <b>AGCC2026</b><br>Prototype only. Replace with secure server authentication before public launch.</p><button class="ghost full" onclick="go('home')">← Back to Home</button></div></div></div>`}
function login(e){e.preventDefault();if(document.getElementById('loginEmail').value.trim()===db.admin.email&&document.getElementById('loginPassword').value===db.admin.password){loggedIn=true;go('dashboard')}else toast('Login failed — check demo credentials')}
function logout(){loggedIn=false;go('home');toast('Logged out')}
function requireAdmin(){if(!loggedIn){go('login');return false}return true}
function renderDashboard(){shell(`<section class="hero"><span class="tag">SECURE AREA • DEMO</span><h2>Admin Dashboard</h2><p>Manage every visible part of the AGCC Scorer prototype. Changes are stored in this browser until a database is connected.</p></section><div class="section-title"><h2>Management</h2><span class="small">Signed in as ${esc(db.admin.email)}</span></div><div class="navgrid">
<button class="navtile" onclick="go('tournament')"><span class="emoji">🏆</span>Tournament Settings<span>Edit name, dates, venue, format</span></button>
<button class="navtile" onclick="go('teams')"><span class="emoji">🛡️</span>Teams<span>Add, edit and remove teams</span></button>
<button class="navtile" onclick="go('players')"><span class="emoji">🏏</span>Players<span>Add, edit player profiles</span></button>
<button class="navtile" onclick="go('matches')"><span class="emoji">📅</span>Matches<span>Create fixtures and score</span></button>
<button class="navtile" onclick="go('points')"><span class="emoji">📊</span>Points Table<span>View standings</span></button>
<button class="navtile" onclick="go('settings')"><span class="emoji">⚙️</span>App Settings<span>Club info, export/reset</span></button>
</div><div class="section-title"><h2>Quick Actions</h2></div><div class="footer-actions"><button class="primary" onclick="newMatch()">＋ Create Match</button><button class="green" onclick="go('live')">▶ Continue Live Scoring</button><button onclick="exportData()">Export Backup JSON</button><button class="danger" onclick="resetDemo()">Reset Demo Data</button></div><div class="section-title"><h2>Data status</h2></div><div class="card"><p>Storage: <b class="gold">Local browser storage</b></p><p>Cloud sync: Not connected</p><p class="small">Use Export Backup before clearing browser data. This prototype is not secure enough for real production admin accounts.</p></div>`)}
function matchCard(m){return `<div class="card" style="margin-bottom:12px"><div class="toolbar" style="justify-content:space-between"><span class="small">${esc(m.title)} • ${esc(m.date)} ${esc(m.time||'')}</span><span class="status">${esc(m.status)}</span></div><div class="matchscore" style="margin:16px 0"><div style="flex:1"><div class="teamline"><span class="teamcrest">${esc(team(m.teamA).short)}</span>${esc(team(m.teamA).name)}</div><div class="small" style="margin:6px 0 0 47px">${m.scoreA?`${m.scoreA.r}-${m.scoreA.w} (${(m.scoreA.b/6).toFixed(1)})`: 'Yet to bat'}</div></div><span class="muted">VS</span><div style="flex:1;text-align:right"><div class="teamline" style="justify-content:flex-end">${esc(team(m.teamB).name)}<span class="teamcrest">${esc(team(m.teamB).short)}</span></div><div class="small" style="margin:6px 47px 0 0">${m.scoreB?`${m.scoreB.r}-${m.scoreB.w} (${(m.scoreB.b/6).toFixed(1)})`:'Yet to bat'}</div></div></div><div class="toolbar" style="justify-content:space-between"><span class="gold small">${esc(m.result||m.venue||'Fixture scheduled')}</span><div class="row-actions"><button onclick="openMatch('${m.id}')">View</button>${loggedIn?`<button onclick="startMatch('${m.id}')">Score</button><button onclick="editMatch('${m.id}')">Edit</button>`:''}</div></div></div>`}
function renderMatches(){shell(`<div class="section-title"><h2>Matches</h2><div class="toolbar"><select id="matchFilter" onchange="filterMatches()"><option value="all">All matches</option><option>Upcoming</option><option>Live</option><option>Completed</option></select>${loggedIn?'<button class="primary" onclick="newMatch()">＋ Create Match</button>':''}</div></div><div id="matchList">${db.matches.slice().reverse().map(matchCard).join('')||'<div class="card empty">No matches found.</div>'}</div>`)}
function filterMatches(){const f=document.getElementById('matchFilter').value;document.getElementById('matchList').innerHTML=db.matches.filter(m=>f==='all'||m.status===f).slice().reverse().map(matchCard).join('')||'<div class="card empty">No matches found.</div>'}
function newMatch(){if(!requireAdmin())return;editingId=null;go('matchform')}
function editMatch(id){if(!requireAdmin())return;editingId=id;go('matchform')}
function renderMatchForm(){const m=db.matches.find(x=>x.id===editingId)||{title:'Club Cricket',date:new Date().toISOString().slice(0,10),time:'08:00',venue:db.tournament.venue,teamA:'',teamB:'',overs:5,status:'Upcoming',tournament:db.tournament.name};shell(`<div class="section-title"><h2>${editingId?'Edit':'Open'} Match</h2><button onclick="go('matches')">← Back</button></div><div class="card"><form onsubmit="saveMatch(event)"><div class="split"><div class="field"><label>Team A</label><select id="mfA" required>${teamOptions(m.teamA)}</select></div><div class="field"><label>Team B</label><select id="mfB" required>${teamOptions(m.teamB)}</select></div></div><div class="field"><label>Match Title</label><input id="mfTitle" value="${esc(m.title)}" required></div><div class="field"><label>Venue</label><input id="mfVenue" value="${esc(m.venue||'')}" required></div><div class="formgrid"><div class="field"><label>Date</label><input id="mfDate" type="date" value="${esc(m.date)}" required></div><div class="field"><label>Time</label><input id="mfTime" type="time" value="${esc(m.time||'08:00')}" required></div><div class="field"><label>Overs</label><select id="mfOvers">${[5,6,8,10,12,15,20].map(n=>`<option ${Number(m.overs)===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="mfStatus">${['Upcoming','Live','Completed'].map(s=>`<option ${m.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="field"><label>Tournament</label><input id="mfTournament" value="${esc(m.tournament||db.tournament.name)}"></div><button class="primary" type="submit">Save Fixture</button> <button type="button" onclick="go('matches')">Cancel</button></form></div>`)}
function saveMatch(e){e.preventDefault();if(!requireAdmin())return;const a=document.getElementById('mfA').value,b=document.getElementById('mfB').value;if(!a||!b||a===b){toast('Select two different teams');return}const obj={id:editingId||'m'+Date.now(),teamA:a,teamB:b,title:document.getElementById('mfTitle').value,date:document.getElementById('mfDate').value,time:document.getElementById('mfTime').value,venue:document.getElementById('mfVenue').value,overs:Number(document.getElementById('mfOvers').value),status:document.getElementById('mfStatus').value,tournament:document.getElementById('mfTournament').value};const old=db.matches.find(m=>m.id===editingId);if(old){Object.assign(old,obj)}else db.matches.push(obj);save();toast('Fixture saved');go('matches')}
function openMatch(id){const m=db.matches.find(x=>x.id===id);if(!m)return;db.activeMatch=id;save();go(m.status==='Live'?'live':m.status==='Completed'?'summary':'summary')}
function startMatch(id){if(!requireAdmin())return;db.activeMatch=id;const m=db.matches.find(x=>x.id===id);if(m.status==='Completed'){toast('This match is completed; edit it to reopen.');return}tossWinner='';tossDecision='Bat';go('toss')}
function renderToss(){const m=db.matches.find(x=>x.id===db.activeMatch);if(!m){go('matches');return}shell(`<div class="section-title"><h2>Who won the toss?</h2><button onclick="go('matches')">Cancel</button></div><div class="grid two"><button class="card ${tossWinner===m.teamA?'active':''}" onclick="tossWinner='${m.teamA}';renderToss()"><span class="teamcrest">${esc(team(m.teamA).short)}</span><h3>${esc(team(m.teamA).name)}</h3>${tossWinner===m.teamA?'<span class="gold">✓ Selected</span>':''}</button><button class="card" onclick="tossWinner='${m.teamB}';renderToss()"><span class="teamcrest">${esc(team(m.teamB).short)}</span><h3>${esc(team(m.teamB).name)}</h3>${tossWinner===m.teamB?'<span class="gold">✓ Selected</span>':''}</button></div><div class="card" style="margin-top:14px"><h3>Decided to?</h3><div class="toolbar"><button class="${tossDecision==='Bat'?'primary':''}" onclick="tossDecision='Bat';renderToss()">🏏 Bat</button><button class="${tossDecision==='Bowl'?'primary':''}" onclick="tossDecision='Bowl';renderToss()">🎯 Bowl</button></div><p class="small">Choose toss winner and decision, then set opening players.</p><button class="primary" style="width:100%;margin-top:12px" onclick="beginScoring()">Start Scoring →</button></div>`)}
function beginScoring(){if(!requireAdmin())return;if(!tossWinner){toast('Select toss winner first');return}const m=db.matches.find(x=>x.id===db.activeMatch);battingTeam=tossDecision==='Bat'?tossWinner:(tossWinner===m.teamA?m.teamB:m.teamA);bowlingTeam=battingTeam===m.teamA?m.teamB:m.teamA;m.status='Live';m.tossWinner=tossWinner;m.tossDecision=tossDecision;m.innings=m.innings||[{batting:battingTeam,bowling:bowlingTeam,r:0,w:0,b:0,extras:0,batters:[],bowlers:[],events:[]}];if(!Array.isArray(m.innings))m.innings=[{batting:battingTeam,bowling:bowlingTeam,r:0,w:0,b:0,extras:0,batters:[],bowlers:[],events:[]}];ensureInnings(m);db.activeMatch=m.id;save();go('live')}
function ensureInnings(m){if(!m.innings||!Array.isArray(m.innings))m.innings=[{batting:m.teamA,bowling:m.teamB,r:0,w:0,b:0,extras:0,batters:[],bowlers:[],events:[]}];let inn=m.innings[m.innings.length-1];if(!inn.batters)inn.batters=[];if(!inn.bowlers)inn.bowlers=[];if(!inn.events)inn.events=[];if(!inn.r)inn.r=0;if(!inn.w)inn.w=0;if(!inn.b)inn.b=0;if(!inn.extras)inn.extras=0;return inn}
function renderLive(){if(!requireAdmin())return;const m=db.matches.find(x=>x.id===db.activeMatch);if(!m){shell('<div class="card empty">No active match. <button onclick="go(\'matches\')">Choose match</button></div>');return}ensureInnings(m);const inn=m.innings[m.innings.length-1];const bats=inn.batters;const bowl=inn.bowlers;const over=Math.floor(inn.b/6)+'.'+(inn.b%6);const rr=inn.b?((inn.r/(inn.b/6))||0).toFixed(1):'0.0';shell(`<div class="section-title"><h2>Match Centre · Live Scoring</h2><button onclick="go('matches')">Matches</button></div><div class="card"><div class="pillrow"><span class="pill">${esc(m.title)}</span><span class="status">LIVE</span><span class="pill">Innings ${m.innings.length}</span></div><div class="livebig"><h3>${esc(team(inn.batting).name)}</h3><div class="runs">${inn.r}-${inn.w}</div><div>${over} / ${m.overs} overs</div><p class="muted">Extras ${inn.extras} · CRR ${rr}</p></div><div class="split"><div><label class="small">Striker</label><select id="striker" onchange="striker=this.value">${playerOptions(striker,inn.batting)}</select></div><div><label class="small">Non-striker</label><select id="nonStriker" onchange="nonStriker=this.value">${playerOptions(nonStriker,inn.batting)}</select></div><div><label class="small">Bowler</label><select id="currentBowler" onchange="currentBowler=this.value">${playerOptions(currentBowler,inn.bowling)}</select></div><div><label class="small">Quick notes</label><div class="pillrow"><span class="pill">Undo available</span><span class="pill">Ball by ball</span></div></div></div></div>
<div class="section-title"><h2>Scoring Controls</h2><button onclick="undoBall()">↶ Undo</button></div><div class="card"><div class="ballgrid">${['0','1','2','3','4','6','WD','NB','B','LB','W','OUT','5','UNDO','END'].map(x=>`<button class="${['WD','NB','B','LB','W','OUT','UNDO','END'].includes(x)?'extra':''}" onclick="scoreBall('${x}')">${x==='0'?'Dot':x==='WD'?'Wide':x==='NB'?'No Ball':x==='B'?'Bye':x==='LB'?'Leg Bye':x==='W'||x==='OUT'?'Wicket':x==='UNDO'?'Undo':x==='END'?'End Innings':x}</button>`).join('')}</div><p class="small">Prototype scoring: balls, runs, extras and wickets update locally. Validate unusual cricket rules manually before official use.</p></div>
<div class="section-title"><h2>Current Batting</h2></div><div class="card">${bats.length?`<div class="tablewrap"><table><thead><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th></tr></thead><tbody>${bats.map(b=>`<tr><td>${esc(player(b.id).name)} ${b.id===striker?'*':''}</td><td>${b.r}</td><td>${b.b}</td><td>${b.fours||0}</td><td>${b.sixes||0}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Select batting players above, then add runs.</p>'}</div>
<div class="section-title"><h2>Current Bowling</h2></div><div class="card">${bowl.length?`<div class="tablewrap"><table><thead><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th></tr></thead><tbody>${bowl.map(b=>`<tr><td>${esc(player(b.id).name)}</td><td>${Math.floor(b.b/6)}.${b.b%6}</td><td>${b.r}</td><td>${b.w}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Choose a bowler to start tracking.</p>'}</div><div class="footer-actions"><button onclick="go('scorecard')">Scorecard</button><button class="primary" onclick="finishMatch()">Finish Match</button></div>`);document.getElementById('striker').value=striker;document.getElementById('nonStriker').value=nonStriker;document.getElementById('currentBowler').value=currentBowler}
function getBat(inn,id){let b=inn.batters.find(x=>x.id===id);if(!b){b={id,r:0,b:0,fours:0,sixes:0,out:false};inn.batters.push(b)}return b}
function getBowl(inn,id){let b=inn.bowlers.find(x=>x.id===id);if(!b){b={id,r:0,w:0,b:0};inn.bowlers.push(b)}return b}
function scoreBall(type){if(!requireAdmin())return;const m=db.matches.find(x=>x.id===db.activeMatch);if(!m)return;const inn=ensureInnings(m);if(type==='UNDO'){undoBall();return}if(type==='END'){if(confirm('End this innings?')){if(m.innings.length===1){m.innings.push({batting:inn.bowling,bowling:inn.batting,r:0,w:0,b:0,extras:0,batters:[],bowlers:[],events:[]});battingTeam=inn.bowling;bowlingTeam=inn.batting;striker='';nonStriker='';currentBowler='';save();render();}else finishMatch()}return}
if(type==='OUT'){type='W';}
if(!striker||!nonStriker||striker===nonStriker){toast('Select two different batters');return}if(!currentBowler){toast('Select a bowler');return}
const before=JSON.stringify(m.innings);let runs=Number(type),extra=0,legal=true,wicket=false;
if(type==='WD'){runs=1;extra=1;legal=false}else if(type==='NB'){runs=1;extra=1;legal=false}else if(type==='B'||type==='LB'){runs=1;extra=1}else if(type==='W'){runs=0;wicket=true}
const bat=getBat(inn,striker), bowl=getBowl(inn,currentBowler);inn.r+=runs;inn.extras+=extra;if(legal)inn.b++;if(!['WD','NB','B','LB','W'].includes(type)){bat.r+=runs;bat.b++;if(runs===4)bat.fours++;if(runs===6)bat.sixes++}else if(type==='B'||type==='LB')bat.b++;
bowl.r+=runs;if(legal)bowl.b++;if(wicket){inn.w++;bowl.w++;bat.out=true;if(inn.w<10){striker='';toast('Wicket! Select a new batter.')}}if(runs%2===1&&type!=='WD'&&type!=='NB'){const temp=striker;striker=nonStriker;nonStriker=temp}if(inn.b%6===0&&legal){const temp=striker;striker=nonStriker;nonStriker=temp}
inn.events.push({type,runs,extra,wicket,legal,before,striker,nonStriker,currentBowler});db.lastScoring={matchId:m.id,before};save();renderLive()}
function undoBall(){if(!requireAdmin())return;const m=db.matches.find(x=>x.id===db.activeMatch);if(!m)return;const inn=ensureInnings(m);const ev=inn.events.pop();if(!ev){toast('No ball to undo');return}m.innings=JSON.parse(ev.before);striker=ev.striker||'';nonStriker=ev.nonStriker||'';currentBowler=ev.currentBowler||'';save();renderLive();toast('Last delivery undone')}
function finishMatch(){if(!requireAdmin())return;const m=db.matches.find(x=>x.id===db.activeMatch);if(!m)return;const inn=m.innings?.[m.innings.length-1];if(inn){if(m.innings.length===1){m.scoreA={r:inn.r,w:inn.w,b:inn.b};}else{const first=m.innings[0],second=inn;m.scoreA={r:first.r,w:first.w,b:first.b};m.scoreB={r:second.r,w:second.w,b:second.b};m.winner=second.r>first.r?second.batting:second.r<first.r?first.batting:null;m.result=m.winner?team(m.winner).name+' won': 'Match tied'}}m.status='Completed';save();go('summary')}
function renderScorecard(){const m=db.matches.find(x=>x.id===db.activeMatch)||db.matches[0];if(!m){go('matches');return}const inn=m.innings?.[m.innings.length-1];shell(`<div class="section-title"><h2>Match Centre · Scorecard</h2><button onclick="go('matches')">← Matches</button></div>${matchCard(m)}${inn?`<div class="section-title"><h2>Batting Scorecard</h2></div><div class="card"><div class="tablewrap"><table><thead><tr><th>Batsman</th><th>R</th><th>B</th><th>4s</th><th>6s</th></tr></thead><tbody>${(inn.batters||[]).map(b=>`<tr><td>${esc(player(b.id).name)} ${b.out?'(out)':'not out'}</td><td>${b.r}</td><td>${b.b}</td><td>${b.fours||0}</td><td>${b.sixes||0}</td></tr>`).join('')}</tbody></table></div><p>Total <b class="gold">${inn.r}/${inn.w}</b> · Overs ${Math.floor(inn.b/6)}.${inn.b%6} · Extras ${inn.extras}</p></div><div class="section-title"><h2>Bowling Scorecard</h2></div><div class="card"><div class="tablewrap"><table><thead><tr><th>Bowler</th><th>Overs</th><th>Runs</th><th>Wickets</th></tr></thead><tbody>${(inn.bowlers||[]).map(b=>`<tr><td>${esc(player(b.id).name)}</td><td>${Math.floor(b.b/6)}.${b.b%6}</td><td>${b.r}</td><td>${b.w}</td></tr>`).join('')}</tbody></table></div></div>`:''}<div class="footer-actions"><button onclick="shareMatch()">Share Match</button><button onclick="go('summary')">Match Summary</button></div>`)}
function renderSummary(){const m=db.matches.find(x=>x.id===db.activeMatch)||db.matches[0];if(!m){go('matches');return}shell(`<div class="section-title"><h2>Match Centre · Summary</h2><button onclick="go('matches')">← Matches</button></div><div class="card"><span class="status">${esc(m.status)}</span><h2 style="text-align:center;margin:14px 0">${esc(team(m.teamA).name)} <span class="gold">VS</span> ${esc(team(m.teamB).name)}</h2><div class="split"><div class="livebig"><div class="runs">${m.scoreA?m.scoreA.r+'-'+m.scoreA.w:'—'}</div><p>${esc(team(m.teamA).name)}</p></div><div class="livebig"><div class="runs">${m.scoreB?m.scoreB.r+'-'+m.scoreB.w:'—'}</div><p>${esc(team(m.teamB).name)}</p></div></div><h3 class="gold" style="text-align:center">${esc(m.result||'Match summary will appear when scoring is completed.')}</h3><p class="muted" style="text-align:center">${esc(m.venue)} · ${esc(m.date)}</p></div><div class="footer-actions"><button onclick="go('scorecard')">View Scorecard</button><button onclick="shareMatch()">Share Match Summary</button>${loggedIn?`<button onclick="startMatch('${m.id}')">Open Scoring</button>`:''}</div>`)}
function shareMatch(){const m=db.matches.find(x=>x.id===db.activeMatch)||db.matches[0];if(!m)return;const text=`${m.title}\n${team(m.teamA).name}: ${m.scoreA?m.scoreA.r+'-'+m.scoreA.w:'—'}\n${team(m.teamB).name}: ${m.scoreB?m.scoreB.r+'-'+m.scoreB.w:'—'}\n${m.result||''}\n${db.tournament.name}`;if(navigator.share)navigator.share({title:'AGCC Match',text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast('Match summary copied')).catch(()=>prompt('Copy match summary',text));else prompt('Copy match summary',text)}
function renderTeams(){shell(`<div class="section-title"><h2>Teams</h2>${loggedIn?'<button class="primary" onclick="teamForm()">＋ Add / Create Team</button>':''}</div>${editingId==='newteam'||editingId?.startsWith('team:')?teamFormMarkup():''}<div class="grid">${db.teams.map(t=>`<div class="card" style="text-align:center"><div class="teamcrest" style="width:70px;height:70px;margin:0 auto 12px;border-color:${t.color};font-size:18px">${esc(t.short)}</div><h3>${esc(t.name)}</h3><p>${esc(t.short)}</p>${loggedIn?`<div class="toolbar" style="justify-content:center"><button onclick="teamForm('${t.id}')">Edit</button><button class="danger" onclick="deleteTeam('${t.id}')">Remove</button></div>`:''}</div>`).join('')}</div>`)}
function teamForm(id=''){if(!requireAdmin())return;editingId=id?'team:'+id:'newteam';renderTeams()}
function teamFormMarkup(){const id=editingId==='newteam'?'':editingId.slice(5),t=db.teams.find(x=>x.id===id)||{name:'',short:'',color:'#ffc629'};return `<div class="card" style="margin-bottom:14px"><h3>${id?'Edit':'Create'} Team</h3><form onsubmit="saveTeam(event)"><div class="formgrid"><div class="field"><label>Team Name</label><input id="teamName" value="${esc(t.name)}" required></div><div class="field"><label>Short Name</label><input id="teamShort" value="${esc(t.short)}" maxlength="5" required></div><div class="field"><label>Accent Color</label><input id="teamColor" type="color" value="${esc(t.color)}"></div></div><button class="primary">Save Team</button> <button type="button" onclick="editingId=null;renderTeams()">Cancel</button></form></div>`}
function saveTeam(e){e.preventDefault();if(!requireAdmin())return;const id=editingId==='newteam'?'':'',oldId=editingId.startsWith('team:')?editingId.slice(5):'';const obj={id:oldId||'t'+Date.now(),name:document.getElementById('teamName').value.toUpperCase(),short:document.getElementById('teamShort').value.toUpperCase(),color:document.getElementById('teamColor').value};if(oldId){const i=db.teams.findIndex(t=>t.id===oldId);db.teams[i]=obj;db.matches.forEach(m=>{if(m.teamA===oldId)m.teamA=obj.id;if(m.teamB===oldId)m.teamB=obj.id})}else db.teams.push(obj);editingId=null;save();renderTeams();toast('Team saved')}
function deleteTeam(id){if(!requireAdmin())return;if(db.matches.some(m=>m.teamA===id||m.teamB===id)){toast('Team is used in a match; edit/remove matches first');return}if(confirm('Remove this team?')){db.teams=db.teams.filter(t=>t.id!==id);db.players=db.players.filter(p=>p.team!==id);save();renderTeams()}}
function renderPlayers(){shell(`<div class="section-title"><h2>Players</h2>${loggedIn?'<button class="primary" onclick="playerForm()">＋ Add / Create Player</button>':''}</div><div class="card"><div class="toolbar"><input id="playerSearch" placeholder="Search player..." oninput="filterPlayers()"><select id="playerTeamFilter" onchange="filterPlayers()"><option value="all">All teams</option>${db.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div></div>${editingId==='newplayer'||editingId?.startsWith('player:')?playerFormMarkup():''}<div id="playerList" class="grid" style="margin-top:12px">${playerCards(db.players)}</div>`)}
function playerCards(arr){return arr.map(p=>`<div class="card"><div class="teamline"><div class="teamcrest">${esc(team(p.team).short)}</div><div><b>${esc(p.name)}</b><div class="small">${esc(team(p.team).name)} · ${esc(p.role||'Player')}</div></div></div><div class="grid two" style="margin-top:12px"><div><p>Runs</p><div class="stat">${p.runs||0}</div></div><div><p>Wickets</p><div class="stat">${p.wickets||0}</div></div></div>${loggedIn?`<div class="toolbar" style="margin-top:12px"><button onclick="playerForm('${p.id}')">Edit</button><button class="danger" onclick="deletePlayer('${p.id}')">Remove</button></div>`:''}</div>`).join('')||'<div class="card empty">No players yet.</div>'}
function filterPlayers(){const q=(document.getElementById('playerSearch')?.value||'').toLowerCase(),t=document.getElementById('playerTeamFilter')?.value||'all';document.getElementById('playerList').innerHTML=playerCards(db.players.filter(p=>p.name.toLowerCase().includes(q)&&(t==='all'||p.team===t)))}
function playerForm(id=''){if(!requireAdmin())return;editingId=id?'player:'+id:'newplayer';renderPlayers()}
function playerFormMarkup(){const id=editingId==='newplayer'?'':editingId.slice(7),p=db.players.find(x=>x.id===id)||{name:'',team:'',role:'Batsman',runs:0,wickets:0};return `<div class="card" style="margin-top:12px"><h3>${id?'Edit':'Create'} Player</h3><form onsubmit="savePlayer(event)"><div class="formgrid"><div class="field"><label>Player Name</label><input id="playerName" value="${esc(p.name)}" required></div><div class="field"><label>Team</label><select id="playerTeam" required>${teamOptions(p.team)}</select></div><div class="field"><label>Role</label><select id="playerRole">${['Batsman','Bowler','All-rounder','Wicketkeeper'].map(r=>`<option ${p.role===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label>Runs</label><input id="playerRuns" type="number" min="0" value="${p.runs||0}"></div><div class="field"><label>Wickets</label><input id="playerWickets" type="number" min="0" value="${p.wickets||0}"></div></div><button class="primary">Save Player</button> <button type="button" onclick="editingId=null;renderPlayers()">Cancel</button></form></div>`}
function savePlayer(e){e.preventDefault();if(!requireAdmin())return;const oldId=editingId.startsWith('player:')?editingId.slice(7):'',obj={id:oldId||'p'+Date.now(),name:document.getElementById('playerName').value,team:document.getElementById('playerTeam').value,role:document.getElementById('playerRole').value,runs:Number(document.getElementById('playerRuns').value),wickets:Number(document.getElementById('playerWickets').value)};if(oldId)db.players[db.players.findIndex(p=>p.id===oldId)]=obj;else db.players.push(obj);editingId=null;save();renderPlayers();toast('Player saved')}
function deletePlayer(id){if(!requireAdmin())return;if(confirm('Remove this player?')){db.players=db.players.filter(p=>p.id!==id);save();renderPlayers()}}
function renderTournament(){const t=db.tournament;shell(`<div class="section-title"><h2>Tournament</h2>${loggedIn?'<button class="primary" onclick="editTournament()">Edit Details</button>':''}</div>${editingId==='tournament'?`<div class="card"><form onsubmit="saveTournament(event)"><div class="formgrid">${[['name','Tournament Name'],['shortName','Short Name'],['year','Year'],['organizer','Club / Organizer'],['start','Start Date'],['end','End Date'],['format','Format'],['ballType','Ball Type'],['venue','Venue'],['location','Location']].map(([k,l])=>`<div class="field"><label>${l}</label><input id="t_${k}" ${['start','end'].includes(k)?'type="date"':''} value="${esc(t[k]||'')}" required></div>`).join('')}</div><button class="primary">Save Settings</button> <button type="button" onclick="editingId=null;renderTournament()">Cancel</button></form></div>`:`<div class="hero"><span class="tag">ESTD. ${esc(t.year)}</span><h2>${esc(t.name)}</h2><p>${esc(t.organizer)} · ${esc(t.location)}</p><p>${esc(t.start)} — ${esc(t.end)} · ${esc(t.format)} · ${esc(t.ballType)}</p></div><div class="section-title"><h2>Club Hall of Fame</h2></div><div class="grid two"><div class="card"><span class="tag">🏆 WINNER</span><h3>${esc(db.matches.find(m=>m.status==='Completed'&&m.winner)?.winner?team(db.matches.find(m=>m.winner)?.winner).name:'To be announced')}</h3><p>Champion</p></div><div class="card"><span class="tag">🥈 RUNNER-UP</span><h3>${esc(db.matches[0]?team(db.matches[0].teamA).name:'To be announced')}</h3><p>Runner-up</p></div></div>`}`)}
function editTournament(){if(!requireAdmin())return;editingId='tournament';renderTournament()}
function saveTournament(e){e.preventDefault();if(!requireAdmin())return;['name','shortName','year','organizer','start','end','format','ballType','venue','location'].forEach(k=>db.tournament[k]=document.getElementById('t_'+k).value);editingId=null;save();renderTournament();toast('Tournament settings saved')}
function renderPoints(){const rows=db.teams.map(t=>{const ms=db.matches.filter(m=>m.status==='Completed'&&(m.teamA===t.id||m.teamB===t.id));let w=0,l=0,tie=0,forRuns=0,against=0;ms.forEach(m=>{const isA=m.teamA===t.id,a=m.scoreA?.r||0,b=m.scoreB?.r||0;forRuns+=isA?a:b;against+=isA?b:a;if(m.winner===t.id)w++;else if(m.winner)l++;else tie++});return {...t,p:ms.length,w,l,tie,pts:w*2+tie,nrr:forRuns-against}}).sort((a,b)=>b.pts-a.pts||b.nrr-a.nrr);shell(`<div class="section-title"><h2>Points Table</h2><span class="small">Demo rules: Win 2 points, tie 1 point</span></div><div class="card"><div class="tablewrap"><table><thead><tr><th>#</th><th>Team</th><th>M</th><th>W</th><th>L</th><th>T</th><th>Pts</th><th>Run difference*</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td><span class="teamline"><span class="teamcrest">${esc(r.short)}</span>${esc(r.name)}</span></td><td>${r.p}</td><td>${r.w}</td><td>${r.l}</td><td>${r.tie}</td><td class="gold"><b>${r.pts}</b></td><td>${r.nrr}</td></tr>`).join('')}</tbody></table></div><p class="small">*Run difference is a simplified demo tie-break, not official net run rate.</p></div>`)}
function renderSettings(){if(!requireAdmin())return;const c=db.club;shell(`<div class="section-title"><h2>App & Club Settings</h2></div><div class="card"><form onsubmit="saveClub(event)"><div class="formgrid">${[['name','Club Name'],['location','Location'],['year','Established Year'],['ballType','Ball Type'],['clubId','Club ID'],['ground','Ground']].map(([k,l])=>`<div class="field"><label>${l}</label><input id="c_${k}" value="${esc(c[k])}" required></div>`).join('')}</div><button class="primary">Save Club Info</button></form></div><div class="section-title"><h2>Data & Backup</h2></div><div class="card"><p>Export a copy of the current browser data before testing or resetting.</p><div class="footer-actions"><button class="primary" onclick="exportData()">Export JSON Backup</button><label class="pill" style="cursor:pointer">Import JSON Backup <input type="file" accept=".json,application/json" style="display:none" onchange="importData(event)"></label><button class="danger" onclick="resetDemo()">Reset All Demo Data</button></div></div><div class="section-title"><h2>Admin Credentials</h2></div><div class="card"><p class="notice">Demo login is stored locally and is not secure. Do not use this for real accounts or upload real passwords.</p><form onsubmit="changeCredentials(event)"><div class="field"><label>New email</label><input id="newAdminEmail" type="email" value="${esc(db.admin.email)}" required></div><div class="field"><label>New password</label><input id="newAdminPassword" type="password" minlength="6" placeholder="At least 6 characters" required></div><button class="primary">Update Demo Credentials</button></form></div>`)}
function saveClub(e){e.preventDefault();if(!requireAdmin())return;Object.keys(db.club).forEach(k=>db.club[k]=document.getElementById('c_'+k).value);save();renderSettings();toast('Club info saved')}
function changeCredentials(e){e.preventDefault();if(!requireAdmin())return;db.admin.email=document.getElementById('newAdminEmail').value;db.admin.password=document.getElementById('newAdminPassword').value;save();renderSettings();toast('Demo credentials updated')}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='agcc-scorer-backup.json';a.click();URL.revokeObjectURL(url);toast('Backup exported')}
function importData(e){if(!requireAdmin())return;const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const imported=JSON.parse(r.result);if(!imported.teams||!imported.matches)throw Error();db={...initial(),...imported};save();go('dashboard');toast('Backup imported')}catch(err){toast('Invalid backup JSON')}};r.readAsText(f)}
function resetDemo(){if(!requireAdmin())return;if(confirm('Reset all app data to original demo values? Export backup first if needed.')){db=initial();save();go('dashboard');toast('Demo data reset')}}
render();
</script>
</body></html>
